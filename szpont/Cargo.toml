[package]
name = "szpont"
version = "1.0.12"
edition = "2024"
rust-version = "1.91"
description = "szpont machen — AI session manager TUI for Claude Code, Codex and Kimi Code"
license = "Unlicense"
repository = "https://github.com/tjzel/szpont-machen"
homepage = "https://github.com/tjzel/szpont-machen"
readme = "../README.md"
keywords = ["tui", "ai", "claude", "codex", "sessions"]
categories = ["command-line-utilities", "development-tools"]

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"
dirs = "5"
libc = "0.2"
notify = "7"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "2", features = ["json"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
struct_field_names = "allow"
